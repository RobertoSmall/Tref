<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F8FAFC" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Três Fases" />
  <title>Três Fases — Gestão Semanal</title>
  <link id="favicon-link" rel="icon" type="image/svg+xml" href="" />
  <link id="apple-icon-link" rel="apple-touch-icon" href="" />
  <link id="manifest-link" rel="manifest" href="" />
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #0F172A;
      --muted: #64748B;
      --border: #E2E8F0;

      /* Geral - Índigo Pastel */
      --indigo-bg: #F5F3FF;
      --indigo-border: #DDD6FE;
      --indigo-main: #6366F1;
      --indigo-dark: #4338CA;

      /* Metas - Azul Céu Pastel */
      --blue-bg: #EFF6FF;
      --blue-border: #BFDBFE;
      --blue-main: #2563EB;
      --blue-dark: #1D4ED8;

      /* Tarefas - Verde Esmeralda Pastel */
      --green-bg: #ECFDF5;
      --green-border: #A7F3D0;
      --green-main: #059669;
      --green-dark: #047857;

      /* Check-in Concluído (Verde Sálvia Pastel) */
      --done-bg: #DCFCE7;
      --done-border: #86EFAC;
      --done-text: #15803D;

      /* Não Fiz (Vermelho Pastel) */
      --fail-bg: #FEF2F2;
      --fail-border: #FECACA;
      --fail-text: #B91C1C;

      /* Agenda - Âmbar Pastel */
      --amber-bg: #FFFBEB;
      --amber-border: #FDE68A;
      --amber-main: #D97706;
      --amber-dark: #B45309;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 44px;
      overflow-x: hidden;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    /* Banner discreto Modo App */
    .pwa-banner {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.78rem;
      color: #475569;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }

    .pwa-banner strong {
      color: #0F172A;
    }

    .pwa-close {
      background: #F1F5F9;
      border: none;
      border-radius: 8px;
      width: 26px;
      height: 26px;
      font-weight: 800;
      color: #64748B;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Cabeçalho Responsivo */
    header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (min-width: 740px) {
      header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .header-top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
    }

    @media (min-width: 740px) {
      .header-top-row {
        width: auto;
        flex: 1;
        flex-wrap: nowrap;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      min-width: 0;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      flex-shrink: 0;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-text h1 {
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1E293B;
      line-height: 1.15;
    }

    .brand-text p {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    @media (max-width: 430px) {
      .brand {
        width: 100%;
      }
      .top-actions {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
    }

    .btn-chart {
      background: var(--indigo-bg);
      border: 1.5px solid var(--indigo-border);
      color: var(--indigo-dark);
      padding: 9px 12px;
      border-radius: 11px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn-chart:hover {
      background: var(--indigo-main);
      border-color: var(--indigo-main);
      color: #FFFFFF;
    }

    .btn-reset {
      background: #FFFFFF;
      border: 1.5px solid #CBD5E1;
      color: #475569;
      padding: 9px 12px;
      border-radius: 11px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn-reset:hover {
      background: #FEF2F2;
      border-color: #FCA5A5;
      color: #B91C1C;
    }

    .btn-reset.confirming {
      background: #FEE2E2;
      border-color: #EF4444;
      color: #991B1B;
    }

    /* Seletor de Semana */
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px 6px;
      gap: 6px;
      width: 100%;
    }

    @media (min-width: 740px) {
      .week-nav {
        width: auto;
        min-width: 245px;
      }
    }

    .week-nav button.arrow-btn {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .week-nav button.arrow-btn:hover {
      background: #E2E8F0;
    }

    .btn-today-pill {
      background: var(--indigo-bg);
      border: 1px solid var(--indigo-border);
      color: var(--indigo-dark);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-today-pill:hover {
      background: var(--indigo-main);
      color: #FFFFFF;
    }

    .week-center {
      text-align: center;
      flex: 1;
      min-width: 0;
    }

    .week-tag {
      display: block;
      font-size: 0.72rem;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.1;
    }

    .week-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: #64748B;
      white-space: nowrap;
    }

    /* Barra de Navegação Principal */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: 1fr;
      gap: 9px;
      margin-bottom: 18px;
      align-items: stretch;
    }

    @media (max-width: 640px) {
      .nav-tabs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .tab-btn {
      width: 100%;
      height: 100%;
      min-height: 70px;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: -0.015em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1.5px solid transparent;
      transition: all 0.15s ease;
      text-align: left;
    }

    .tab-btn-title {
      line-height: 1.2;
      white-space: nowrap;
    }

    @media (max-width: 370px) {
      .tab-btn {
        padding: 10px 10px;
        gap: 6px;
        font-size: 0.88rem;
      }
    }

    .nav-ring-wrap {
      position: relative;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .nav-ring-wrap svg {
      width: 40px;
      height: 40px;
      transform: rotate(-90deg);
    }

    .nav-ring-bg {
      fill: none;
      stroke: rgba(15, 23, 42, 0.09);
      stroke-width: 3.6;
    }

    .nav-ring-fg {
      fill: none;
      stroke-width: 3.6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s ease;
    }

    .nav-ring-val {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.66rem;
      font-weight: 900;
      color: #0F172A;
    }

    .tab-btn.active .nav-ring-bg {
      stroke: rgba(255, 255, 255, 0.25);
    }

    .tab-btn.active .nav-ring-val {
      color: #FFFFFF;
    }

    .tab-btn[data-tab="overview"] {
      background: var(--indigo-bg);
      border-color: var(--indigo-border);
      color: var(--indigo-dark);
    }
    .tab-btn[data-tab="overview"].active {
      background: var(--indigo-main);
      border-color: var(--indigo-main);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }

    .tab-btn[data-tab="metas"] {
      background: var(--blue-bg);
      border-color: var(--blue-border);
      color: var(--blue-dark);
    }
    .tab-btn[data-tab="metas"].active {
      background: var(--blue-main);
      border-color: var(--blue-main);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .tab-btn[data-tab="tarefas"] {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green-dark);
    }
    .tab-btn[data-tab="tarefas"].active {
      background: var(--green-main);
      border-color: var(--green-main);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
    }

    .tab-btn[data-tab="agenda"] {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      color: var(--amber-dark);
    }
    .tab-btn[data-tab="agenda"].active {
      background: var(--amber-main);
      border-color: var(--amber-main);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25);
    }

    /* Painéis das Fases */
    .panel {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .panel.metas-theme {
      background: var(--blue-bg);
      border-color: var(--blue-border);
    }

    .panel.tarefas-theme {
      background: var(--green-bg);
      border-color: var(--green-border);
    }

    .panel.agenda-theme {
      background: var(--amber-bg);
      border-color: var(--amber-border);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 800;
      color: #1E293B;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btns {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Botões de Ação */
    .btn-primary {
      border: none;
      border-radius: 11px;
      padding: 9px 14px;
      font-size: 0.82rem;
      font-weight: 800;
      color: #FFFFFF;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-blue { background: var(--blue-main); }
    .btn-blue:hover { background: var(--blue-dark); }

    .btn-green { background: var(--green-main); }
    .btn-green:hover { background: var(--green-dark); }

    .btn-amber { background: var(--amber-main); }
    .btn-amber:hover { background: var(--amber-dark); }

    .btn-outline-green {
      background: #FFFFFF;
      border: 1.5px solid var(--green-border);
      color: var(--green-dark);
      border-radius: 11px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
    }

    /* Formulários */
    .form-box {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    input[type="text"],
    input[type="time"],
    select {
      background: #FFFFFF;
      border: 1.5px solid #CBD5E1;
      border-radius: 11px;
      padding: 9px 11px;
      font-size: 0.85rem;
      color: var(--text);
      outline: none;
      min-height: 40px;
    }

    /* Correção dos botões/inputs de hora no mobile e desktop */
    input[type="time"] {
      min-width: 118px;
      width: auto;
      height: 40px;
      padding: 0 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
      appearance: none;
      -webkit-appearance: none;
    }

    input[type="time"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.75;
      margin-left: 4px;
    }

    .grow {
      flex: 1 1 180px;
    }

    .btn-cancel {
      background: #F1F5F9;
      border: none;
      border-radius: 11px;
      padding: 9px 12px;
      min-height: 40px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Seletor Múltiplo de Dias da Semana (Agenda) */
    .agenda-form-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .agenda-field-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 800;
      color: #78350F;
      margin-bottom: 5px;
    }

    .multi-day-picker {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day-check-pill {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border: 1.5px solid #FDE68A;
      border-radius: 10px;
      min-height: 36px;
      padding: 6px 2px;
      font-size: 0.74rem;
      font-weight: 800;
      color: #78350F;
      cursor: pointer;
      user-select: none;
      transition: all 0.14s ease;
    }

    .day-check-pill input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .day-check-pill:has(input:checked),
    .day-check-pill.is-checked {
      background: var(--amber-main);
      border-color: var(--amber-main);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(217, 119, 6, 0.22);
    }

    .agenda-quick-days {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .quick-day-btn {
      background: #FEF3C7;
      border: 1px solid #FDE68A;
      color: #92400E;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
    }

    .quick-day-btn:hover {
      background: #FDE68A;
    }

    .agenda-time-repeat-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 8px;
    }

    .agenda-form-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 2px;
    }

    /* Barra de Abas por Dia na Agenda (Seg a Dom) */
    .agenda-day-tabs {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 12px;
    }

    .agenda-day-tab {
      background: #FFFFFF;
      border: 1.5px solid var(--amber-border);
      border-radius: 11px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      cursor: pointer;
      transition: all 0.14s ease;
      min-height: 50px;
    }

    .agenda-day-tab .adt-name {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #92400E;
      line-height: 1.1;
    }

    .agenda-day-tab .adt-num {
      font-size: 0.65rem;
      font-weight: 700;
      color: #B45309;
      line-height: 1.1;
    }

    .agenda-day-tab .adt-count {
      font-size: 0.62rem;
      font-weight: 800;
      color: #78350F;
      background: #FEF3C7;
      border-radius: 999px;
      padding: 0 5px;
      margin-top: 1px;
      min-width: 16px;
      text-align: center;
    }

    .agenda-day-tab.is-today {
      border-color: #F59E0B;
      box-shadow: 0 0 0 1px rgba(217, 119, 6, 0.25);
    }

    .agenda-day-tab.active {
      background: var(--amber-main);
      border-color: var(--amber-main);
      box-shadow: 0 3px 10px rgba(217, 119, 6, 0.25);
    }

    .agenda-day-tab.active .adt-name,
    .agenda-day-tab.active .adt-num {
      color: #FFFFFF;
    }

    .agenda-day-tab.active .adt-count {
      background: rgba(255, 255, 255, 0.24);
      color: #FFFFFF;
    }

    .agenda-selected-day-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      padding: 0 2px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #92400E;
    }

    /* Cartão de Meta Semanal */
    .meta-card {
      background: #FFFFFF;
      border: 1.5px solid var(--blue-border);
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .meta-title-group {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      flex: 1;
      min-width: 0;
    }

    .meta-name {
      font-size: 0.94rem;
      font-weight: 800;
      color: #0F172A;
    }

    .meta-actions-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-edit {
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      color: #1D4ED8;
      font-size: 0.74rem;
      font-weight: 800;
      cursor: pointer;
      padding: 4px 9px;
      border-radius: 8px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn-edit:hover {
      background: #2563EB;
      border-color: #2563EB;
      color: #FFFFFF;
    }

    .btn-edit-amber {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #B45309;
      font-size: 0.74rem;
      font-weight: 800;
      cursor: pointer;
      padding: 4px 9px;
      border-radius: 8px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn-edit-amber:hover {
      background: #D97706;
      border-color: #D97706;
      color: #FFFFFF;
    }

    .edit-goal-box {
      background: #F8FAFC;
      border: 1.5px solid #BFDBFE;
      border-radius: 12px;
      padding: 11px;
      margin-bottom: 10px;
    }

    .edit-event-box {
      background: #FFFDF7;
      border: 1.5px solid #FDE68A;
      border-radius: 12px;
      padding: 11px;
      margin-top: -2px;
      margin-bottom: 10px;
    }

    .edit-goal-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 800;
      color: #1E3A8A;
      margin-bottom: 4px;
    }

    .edit-goal-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
