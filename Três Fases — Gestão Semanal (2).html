<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F8FAFC" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Três Fases" />
  <title>Três Fases — Gestão Semanal</title>
  <link id="favicon-link" rel="icon" type="image/svg+xml" href="" />
  <link id="apple-icon-link" rel="apple-touch-icon" href="" />
  <link id="manifest-link" rel="manifest" href="" />
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #0F172A;
      --muted: #64748B;
      --border: #E2E8F0;

      /* Geral - Índigo Pastel */
      --indigo-bg: #F5F3FF;
      --indigo-border: #DDD6FE;
      --indigo-main: #6366F1;
      --indigo-dark: #4338CA;

      /* Metas - Azul Céu Pastel */
      --blue-bg: #EFF6FF;
      --blue-border: #BFDBFE;
      --blue-main: #2563EB;
      --blue-dark: #1D4ED8;

      /* Tarefas - Verde Esmeralda Pastel */
      --green-bg: #ECFDF5;
      --green-border: #A7F3D0;
      --green-main: #059669;
      --green-dark: #047857;

      /* Check-in Concluído (Verde Sálvia Pastel) */
      --done-bg: #DCFCE7;
      --done-border: #86EFAC;
      --done-text: #15803D;

      /* Não Fiz (Vermelho Pastel) */
      --fail-bg: #FEF2F2;
      --fail-border: #FECACA;
      --fail-text: #B91C1C;

      /* Agenda - Âmbar Pastel */
      --amber-bg: #FFFBEB;
      --amber-border: #FDE68A;
      --amber-main: #D97706;
      --amber-dark: #B45309;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 44px;
      overflow-x: hidden;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    /* Banner discreto Modo App */
    .pwa-banner {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.78rem;
      color: #475569;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }

    .pwa-banner strong {
      color: #0F172A;
    }

    .pwa-close {
      background: #F1F5F9;
      border: none;
      border-radius: 8px;
      width: 26px;
      height: 26px;
      font-weight: 800;
      color: #64748B;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Cabeçalho Responsivo */
    header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (min-width: 740px) {
      header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .header-top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
    }

    @media (min-width: 740px) {
      .header-top-row {
        width: auto;
        flex: 1;
        flex-wrap: nowrap;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      min-width: 0;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      flex-shrink: 0;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-text h1 {
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1E293B;
      line-height: 1.15;
    }

    .brand-text p {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    @media (max-width: 430px) {
      .brand {
        width: 100%;
      }
      .top-actions {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
    }

    .btn-chart {
      background: var(--indigo-bg);
      border: 1.5px solid var(--indigo-border);
      color: var(--indigo-dark);
      padding: 9px 12px;
      border-radius: 11px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn-chart:hover {
      background: var(--indigo-main);
      border-color: var(--indigo-main);
      color: #FFFFFF;
    }

    .btn-reset {
      background: #FFFFFF;
      border: 1.5px solid #CBD5E1;
      color: #475569;
      padding: 9px 12px;
      border-radius: 11px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn-reset:hover {
      background: #FEF2F2;
      border-color: #FCA5A5;
      color: #B91C1C;
    }

    .btn-reset.confirming {
      background: #FEE2E2;
      border-color: #EF4444;
      color: #991B1B;
    }

    /* Seletor de Semana */
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px 6px;
      gap: 6px;
      width: 100%;
    }

    @media (min-width: 740px) {
      .week-nav {
        width: auto;
        min-width: 245px;
      }
    }

    .week-nav button.arrow-btn {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .week-nav button.arrow-btn:hover {
      background: #E2E8F0;
    }

    .btn-today-pill {
      background: var(--indigo-bg);
      border: 1px solid var(--indigo-border);
      color: var(--indigo-dark);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-today-pill:hover {
      background: var(--indigo-main);
      color: #FFFFFF;
    }

    .week-center {
      text-align: center;
      flex: 1;
      min-width: 0;
    }

    .week-tag {
      display: block;
      font-size: 0.72rem;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.1;
    }

    .week-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: #64748B;
      white-space: nowrap;
    }

    /* Barra de Navegação Principal — 4 Caixas Simétricas sem Ícones para Palavras Completas */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: 1fr;
      gap: 9px;
      margin-bottom: 18px;
      align-items: stretch;
    }

    @media (max-width: 640px) {
      .nav-tabs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .tab-btn {
      width: 100%;
      height: 100%;
      min-height: 70px;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: -0.015em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1.5px solid transparent;
      transition: all 0.15s ease;
      text-align: left;
    }

    .tab-btn-title {
      line-height: 1.2;
      white-space: nowrap;
    }

    @media (max-width: 370px) {
      .tab-btn {
        padding: 10px 10px;
        gap: 6px;
        font-size: 0.88rem;
      }
    }

    /* Anel Circular Integrado nos Botões Principais */
    .nav-ring-wrap {
      position: relative;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .nav-ring-wrap svg {
      width: 40px;
      height: 40px;
      transform: rotate(-90deg);
    }

    .nav-ring-bg {
      fill: none;
      stroke: rgba(15, 23, 42, 0.09);
      stroke-width: 3.6;
    }

    .nav-ring-fg {
      fill: none;
      stroke-width: 3.6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s ease;
    }

    .nav-ring-val {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.66rem;
      font-weight: 900;
      color: #0F172A;
    }

    .tab-btn.active .nav-ring-bg {
      stroke: rgba(255, 255, 255, 0.25);
    }

    .tab-btn.active .nav-ring-val {
      color: #FFFFFF;
    }

    .tab-btn[data-tab="overview"] {
      background: var(--indigo-bg);
      border-color: var(--indigo-border);
      color: var(--indigo-dark);
    }
    .tab-btn[data-tab="overview"].active {
      background: var(--indigo-main);
      border-color: var(--indigo-main);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }

    .tab-btn[data-tab="metas"] {
      background: var(--blue-bg);
      border-color: var(--blue-border);
      color: var(--blue-dark);
    }
    .tab-btn[data-tab="metas"].active {
      background: var(--blue-main);
      border-color: var(--blue-main);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .tab-btn[data-tab="tarefas"] {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green-dark);
    }
    .tab-btn[data-tab="tarefas"].active {
      background: var(--green-main);
      border-color: var(--green-main);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
    }

    .tab-btn[data-tab="agenda"] {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      color: var(--amber-dark);
    }
    .tab-btn[data-tab="agenda"].active {
      background: var(--amber-main);
      border-color: var(--amber-main);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.25);
    }

    /* Painéis das Fases */
    .panel {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .panel.metas-theme {
      background: var(--blue-bg);
      border-color: var(--blue-border);
    }

    .panel.tarefas-theme {
      background: var(--green-bg);
      border-color: var(--green-border);
    }

    .panel.agenda-theme {
      background: var(--amber-bg);
      border-color: var(--amber-border);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 800;
      color: #1E293B;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btns {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Botões de Ação Sob Demanda */
    .btn-primary {
      border: none;
      border-radius: 11px;
      padding: 9px 14px;
      font-size: 0.82rem;
      font-weight: 800;
      color: #FFFFFF;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-blue { background: var(--blue-main); }
    .btn-blue:hover { background: var(--blue-dark); }

    .btn-green { background: var(--green-main); }
    .btn-green:hover { background: var(--green-dark); }

    .btn-amber { background: var(--amber-main); }
    .btn-amber:hover { background: var(--amber-dark); }

    .btn-outline-green {
      background: #FFFFFF;
      border: 1.5px solid var(--green-border);
      color: var(--green-dark);
      border-radius: 11px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
    }

    /* Formulários */
    .form-box {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    input[type="text"],
    input[type="time"],
    select {
      background: #FFFFFF;
      border: 1.5px solid #CBD5E1;
      border-radius: 11px;
      padding: 9px 11px;
      font-size: 0.85rem;
      color: var(--text);
      outline: none;
    }

    .grow {
      flex: 1 1 180px;
    }

    .btn-cancel {
      background: #F1F5F9;
      border: none;
      border-radius: 11px;
      padding: 9px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
    }

    /* Cartão de Meta Semanal */
    .meta-card {
      background: #FFFFFF;
      border: 1.5px solid var(--blue-border);
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .meta-title-group {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      flex: 1;
      min-width: 0;
    }

    .meta-name {
      font-size: 0.94rem;
      font-weight: 800;
      color: #0F172A;
    }

    .meta-actions-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-edit {
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      color: #1D4ED8;
      font-size: 0.74rem;
      font-weight: 800;
      cursor: pointer;
      padding: 4px 9px;
      border-radius: 8px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .btn-edit:hover {
      background: #2563EB;
      border-color: #2563EB;
      color: #FFFFFF;
    }

    .edit-goal-box {
      background: #F8FAFC;
      border: 1.5px solid #BFDBFE;
      border-radius: 12px;
      padding: 11px;
      margin-bottom: 10px;
    }

    .edit-goal-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 800;
      color: #1E3A8A;
      margin-bottom: 4px;
    }

    .edit-goal-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    @media (min-width: 560px) {
      .edit-goal-grid {
        grid-template-columns: 2fr 1fr 1.3fr;
      }
    }

    .edit-goal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 9px;
    }

    .freq-select {
      padding: 4px 7px;
      font-size: 0.74rem;
      font-weight: 700;
      border-radius: 8px;
      background: var(--blue-bg);
      border: 1px solid var(--blue-border);
      color: var(--blue-dark);
      cursor: pointer;
    }

    .meta-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      background: #F1F5F9;
      color: #334155;
    }

    .meta-badge.completed {
      background: var(--done-bg);
      color: var(--done-text);
      border: 1px solid var(--done-border);
    }

    .cycle-info {
      font-size: 0.74rem;
      font-weight: 700;
      color: #64748B;
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--blue-main);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .progress-bar-fill.completed {
      background: #22C55E;
    }

    .days-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day-btn {
      background: #F8FAFC;
      border: 1.5px solid #E2E8F0;
      border-radius: 10px;
      padding: 6px 2px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      transition: all 0.12s ease;
    }

    .day-btn.today-day {
      border-color: #60A5FA;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.25);
    }

    .day-btn .d-label {
      font-size: 0.66rem;
      font-weight: 800;
      color: #64748B;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .day-btn .d-date {
      font-size: 0.64rem;
      font-weight: 700;
      color: #94A3B8;
      line-height: 1.1;
      margin-bottom: 1px;
    }

    .day-btn.today-day .d-label,
    .day-btn.today-day .d-date {
      color: #1D4ED8;
    }

    .day-btn .d-icon {
      font-size: 0.86rem;
      font-weight: 800;
      color: #94A3B8;
    }

    .day-btn.done {
      background: var(--done-bg);
      border-color: var(--done-border);
    }
    .day-btn.done .d-label,
    .day-btn.done .d-date,
    .day-btn.done .d-icon {
      color: var(--done-text);
    }

    .day-btn.fail {
      background: var(--fail-bg);
      border-color: var(--fail-border);
    }
    .day-btn.fail .d-label,
    .day-btn.fail .d-date,
    .day-btn.fail .d-icon {
      color: var(--fail-text);
    }

    .btn-del {
      background: transparent;
      border: 1px solid transparent;
      color: #94A3B8;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .btn-del:hover {
      background: #FEF2F2;
      color: #B91C1C;
    }

    .btn-del.confirming {
      background: #FEE2E2;
      border-color: #EF4444;
      color: #991B1B;
    }

    /* Listas de Tarefas */
    .category-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .cat-pill {
      background: #FFFFFF;
      border: 1.5px solid var(--green-border);
      color: #334155;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .cat-pill.active {
      background: var(--green-main);
      border-color: var(--green-main);
      color: #FFFFFF;
    }

    .item-row {
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .item-row.checked {
      background: var(--done-bg);
      border-color: var(--done-border);
    }

    .item-row.today-event {
      border-color: #F59E0B;
      box-shadow: 0 2px 6px rgba(217, 119, 6, 0.08);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      flex: 1;
      min-width: 0;
    }

    .check-circle {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid #CBD5E1;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 900;
      color: transparent;
      flex-shrink: 0;
    }

    .item-row.checked .check-circle {
      background: #22C55E;
      border-color: #22C55E;
      color: #FFFFFF;
    }

    .item-text {
      font-size: 0.88rem;
      font-weight: 600;
      color: #1E293B;
      word-break: break-word;
    }

    .item-row.checked .item-text {
      text-decoration: line-through;

<body>
  <div class="container" id="app"></div>

  <script>
    (function () {
      const STORAGE_KEY = "tres_fases_app_v10";
      const LEGACY_STORAGE_KEYS = ["tres_fases_app_v9", "tres_fases_app_v8"];
      const DAYS = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];
      const DAYS_FULL = ["Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado", "Domingo"];
      const MONTHS_SHORT = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

      let memoryFallback = null;
      let pendingConfirm = null;
      let confirmTimer = null;
      let showChartModal = false;
      let openForm = null;
      let editingGoalId = null;

      /* ==================================================================
         SINCRONIZAÇÃO COM DATA E SEMANA REAIS DO SISTEMA
         ================================================================== */
      function getRealToday() {
        return new Date();
      }

      function getMonday(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        d.setDate(diff);
        d.setHours(0, 0, 0, 0);
        return d;
      }

      function getRealTodayDayIndex() {
        // Segunda = 0, Terça = 1, ..., Domingo = 6
        return (getRealToday().getDay() + 6) % 7;
      }

      function formatWeekKey(mondayDate) {
        const y = mondayDate.getFullYear();
        const m = String(mondayDate.getMonth() + 1).padStart(2, "0");
        const d = String(mondayDate.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + d;
      }

      function getRealCurrentWeekKey() {
        return formatWeekKey(getMonday(getRealToday()));
      }

      function shiftWeek(weekKey, deltaWeeks) {
        const parts = weekKey.split("-").map(Number);
        const dt = new Date(parts[0], parts[1] - 1, parts[2] + deltaWeeks * 7);
        return formatWeekKey(dt);
      }

      function getWeekDayDates(weekKey) {
        const parts = weekKey.split("-").map(Number);
        const dates = [];
        for (let i = 0; i < 7; i++) {
          const dt = new Date(parts[0], parts[1] - 1, parts[2] + i);
          dates.push({
            dayNumber: dt.getDate(),
            monthNumber: dt.getMonth() + 1
          });
        }
        return dates;
      }

      function formatWeekRangeLong(weekKey) {
        const parts = weekKey.split("-").map(Number);
        const start = new Date(parts[0], parts[1] - 1, parts[2]);
        const end = new Date(parts[0], parts[1] - 1, parts[2] + 6);
        return (
          start.getDate() +
          " de " +
          MONTHS_SHORT[start.getMonth()] +
          " – " +
          end.getDate() +
          " de " +
          MONTHS_SHORT[end.getMonth()]
        );
      }

      function formatWeekShort(weekKey) {
        const parts = weekKey.split("-").map(Number);
        const d = String(parts[2]).padStart(2, "0");
        const m = String(parts[1]).padStart(2, "0");
        return d + "/" + m;
      }

      function getWeekRelativeTitle(weekKey) {
        const realCur = getRealCurrentWeekKey();
        if (weekKey === realCur) return "Semana Atual";
        if (weekKey === shiftWeek(realCur, -1)) return "Semana Passada";
        if (weekKey === shiftWeek(realCur, 1)) return "Próxima Semana";
        return "Semana";
      }

      function defaultState() {
        const realCur = getRealCurrentWeekKey();
        const prev1 = shiftWeek(realCur, -1);
        const prev2 = shiftWeek(realCur, -2);
        return {
          activeTab: "overview",
          selectedWeek: realCur,
          selectedCategory: "Todas",
          dismissedPwaBanner: false,
          categories: ["Trabalho", "Torneio", "Casa", "Mercado"],
          goals: [
            {
              id: "g1",
              title: "Treino / CrossFit",
              targetPerWeek: 3,
              durationWeeks: 4,
              startWeek: prev2,
              progress: {
                [prev2]: [1, 0, 1, 0, 0, 0, 0],
                [prev1]: [1, 0, 1, 0, 1, 0, 0],
                [realCur]: [1, 0, 1, 0, 0, 0, 0]
              }
            },
            {
              id: "g2",
              title: "Alimentação limpa & hidratação",
              targetPerWeek: 6,
              durationWeeks: 12,
              startWeek: prev2,
              progress: {
                [prev2]: [1, 2, 1, 0, 0, 0, 0],
                [prev1]: [1, 1, 1, 1, 2, 1, 0],
                [realCur]: [1, 1, 2, 1, 0, 0, 0]
              }
            }
          ],
          tasks: [
            { id: "t1", text: "Revisar orçamentos da semana", category: "Trabalho", done: true },
            { id: "t2", text: "Confirmar tabela de jogos e horários", category: "Torneio", done: false },
            { id: "t3", text: "Comprar frutas, ovos e água", category: "Mercado", done: false },
            { id: "t4", text: "Organizar planilhas e materiais", category: "Trabalho", done: true }
          ],
          events: [
            {
              id: "e1",
              title: "Planejamento semanal",
              dayIndex: 0,
              time: "08:00",
              recurring: true,
              createdWeek: prev2,
              completedWeeks: {
                [prev2]: true,
                [prev1]: true,
                [realCur]: true
              }
            },
            {
              id: "e2",
              title: "Treino técnico em quadra",
              dayIndex: 4,
              time: "18:30",
              recurring: true,
              createdWeek: prev2,
              completedWeeks: {
                [prev1]: true
              }
            }
          ]
        };
      }

      function loadState() {
        const realCur = getRealCurrentWeekKey();
        let loaded = null;

        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            loaded = JSON.parse(raw);
          } else {
            for (let i = 0; i < LEGACY_STORAGE_KEYS.length; i++) {
              const legacyRaw = localStorage.getItem(LEGACY_STORAGE_KEYS[i]);
              if (legacyRaw) {
                loaded = JSON.parse(legacyRaw);
                break;
              }
            }
          }
        } catch (e) {
          if (memoryFallback) loaded = memoryFallback;
        }

        if (!loaded) {
          return defaultState();
        }

        // Sempre sincroniza ao abrir para a semana real atual (sem ficar preso em semana passada)
        const normalizedGoals = Array.isArray(loaded.goals)
          ? loaded.goals.map(function (g) {
              const dur = g.durationWeeks !== undefined ? Number(g.durationWeeks) : 4;
              return {
                ...g,
                durationWeeks: isNaN(dur) ? 4 : dur,
                startWeek: g.startWeek || realCur,
                progress: g.progress || {}
              };
            })
          : [];

        const syncedState = {
          ...defaultState(),
          ...loaded,
          selectedWeek: realCur,
          goals: normalizedGoals
        };

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(syncedState));
        } catch (e) {}

        return syncedState;
      }

      function saveState(nextState) {
        state = nextState;
        memoryFallback = nextState;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
        } catch (e) {}
      }

      let state = loadState();

      function buildOfficialLogoShapes() {
        return (
          /* Dobra interna 1 (Índigo escuro) */
          '<path d="M 48 48 C 52 58 52 72 34 80 L 22 86 C 36 78 38 64 38 56 Z" fill="#44428D"/>' +
          /* Dobra interna 2 (Índigo escuro) */
          '<path d="M 78 32 C 84 46 84 68 62 80 L 48 87 C 66 76 68 58 68 44 Z" fill="#44428D"/>' +
          /* Fase 1: Onda azul claro ascendente */
          '<path d="M 18 86 L 18 68 C 18 53 31 48 48 48 L 48 64 C 48 79 34 86 18 86 Z" fill="#8EC2F0"/>' +
          '<path d="M 18 86 C 34 86 48 79 48 64 L 38 64 C 38 75 29 82 18 86 Z" fill="#7CB4E6" opacity="0.55"/>' +
          /* Fase 2: Onda verde menta ascendente */
          '<path d="M 22 86 C 38 86 48 76 48 60 C 48 42 60 32 78 32 L 78 56 C 78 76 62 86 40 86 Z" fill="#95CEB3"/>' +
          '<path d="M 48 86 C 64 86 78 76 78 56 L 68 56 C 68 72 58 81 48 86 Z" fill="#82BEA2" opacity="0.55"/>' +
          /* Fase 3: Onda amarelo âmbar ascendente */
          '<path d="M 48 86 C 65 86 78 74 78 54 L 78 40 C 78 24 89 16 104 16 L 104 54 C 104 75 88 86 64 86 Z" fill="#F5B453"/>'
        );
      }

      function setupAppIconsAndManifest() {
        const svgIcon =
          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'>" +
          "<rect width='120' height='120' rx='26' fill='#F6F7FB'/>" +
          "<g transform='translate(0, 8)'>" +
          buildOfficialLogoShapes() +
          "</g>" +
          "</svg>";
        const dataUri = "data:image/svg+xml," + encodeURIComponent(svgIcon);

        const fav = document.getElementById("favicon-link");
        const apple = document.getElementById("apple-icon-link");
        if (fav) fav.href = dataUri;
        if (apple) apple.href = dataUri;

        try {
          const manifestObj = {
            name: "Três Fases — Gestão Semanal",
            short_name: "Três Fases",
            start_url: ".",
            display: "standalone",
            background_color: "#F8FAFC",
            theme_color: "#F8FAFC",
            icons: [
              {
                src: dataUri,
                sizes: "512x512",
                type: "image/svg+xml",
                purpose: "any maskable"
              }
            ]
          };
          const blob = new Blob([JSON.stringify(manifestObj)], { type: "application/manifest+json" });
          const manifestEl = document.getElementById("manifest-link");
          if (manifestEl) manifestEl.href = URL.createObjectURL(blob);
        } catch (e) {}
      }

      function renderLogoSVG() {
        return (
          '<svg width="28" height="28" viewBox="10 10 102 86" fill="none" xmlns="http://www.w3.org/2000/svg">' +
          buildOfficialLogoShapes() +
          "</svg>"
        );
      }

      function renderNavRing(pct, strokeColor, isActive) {
        const r = 15.5;
        const c = 2 * Math.PI * r;
        const offset = c - (pct / 100) * c;
        const activeStroke = isActive ? "#FFFFFF" : strokeColor;
        return (
          '<div class="nav-ring-wrap">' +
            '<svg viewBox="0 0 40 40">' +
              '<circle class="nav-ring-bg" cx="20" cy="20" r="' + r + '"></circle>' +
              '<circle class="nav-ring-fg" cx="20" cy="20" r="' + r + '" stroke="' + activeStroke + '" ' +
                'stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) + '"></circle>' +
            "</svg>" +
            '<div class="nav-ring-val">' + pct + "%</div>" +
          "</div>"
        );
      }

      function requestConfirm(key) {
        if (pendingConfirm === key) {
          pendingConfirm = null;
          if (confirmTimer) clearTimeout(confirmTimer);
          return true;
        }
        pendingConfirm = key;
        if (confirmTimer) clearTimeout(confirmTimer);
        confirmTimer = setTimeout(function () {
          pendingConfirm = null;
          render();
        }, 3500);
        render();
        return false;
      }

      function weeksDiff(startWk, currentWk) {
        const p1 = startWk.split("-").map(Number);
        const p2 = currentWk.split("-").map(Number);
        const d1 = new Date(p1[0], p1[1] - 1, p1[2]);
        const d2 = new Date(p2[0], p2[1] - 1, p2[2]);
        return Math.round((d2 - d1) / (7 * 24 * 60 * 60 * 1000));
      }

      /* ==================================================================
         FILTRO DE VISIBILIDADE DE METAS POR HORIZONTE / REPETIÇÃO
         ================================================================== */
      function isGoalVisibleInWeek(goal, weekKey) {
        const startWeek = goal.startWeek || getRealCurrentWeekKey();
        const durationWeeks = goal.durationWeeks !== undefined ? Number(goal.durationWeeks) : 4;

        // 1 semana (ou repetição semanal desativada): aparece apenas na semana em que foi criada
        if (durationWeeks === 1 || goal.repeatWeekly === false) {
          return startWeek === weekKey;
        }

        // 0 = Contínua: aparece da semana de início em diante
        if (durationWeeks === 0) {
          return weekKey >= startWeek;
        }

        // Ciclo finito (ex: 2, 4, 8, 12, 24 semanas): aparece de startWeek até startWeek + (durationWeeks - 1)
        const endWeek = shiftWeek(startWeek, durationWeeks - 1);
        return weekKey >= startWeek && weekKey <= endWeek;
      }

      function getVisibleGoals(weekKey) {
        return state.goals.filter(function (g) {
          return isGoalVisibleInWeek(g, weekKey);
        });
      }

      function getGoalStats(goal, weekKey) {
        const arr = (goal.progress && goal.progress[weekKey]) || [0, 0, 0, 0, 0, 0, 0];
        const doneCount = arr.filter(function (v) { return v === 1; }).length;
        const failCount = arr.filter(function (v) { return v === 2; }).length;
        const target = Math.max(1, Math.min(7, Number(goal.targetPerWeek) || 7));

        let pct = 0;
        if (target === 7) {
          const evaluated = doneCount + failCount;
          pct = evaluated > 0 ? Math.round((doneCount / evaluated) * 100) : 0;
        } else {
          pct = Math.min(100, Math.round((doneCount / target) * 100));
        }

        const durationWeeks = goal.durationWeeks !== undefined ? Number(goal.durationWeeks) : 4;
        const startWeek = goal.startWeek || getRealCurrentWeekKey();
        const elapsedIdx = Math.max(0, weeksDiff(startWeek, weekKey));
        let cycleText = "Contínua · repete toda semana";
        let cyclePct = pct;

        if (durationWeeks === 1 || goal.repeatWeekly === false) {
          cycleText = "Apenas esta semana (sem repetição)";
        } else if (durationWeeks > 1) {
          const currentStep = Math.min(durationWeeks, elapsedIdx + 1);
          let totalDoneInCycle = 0;
          for (let i = 0; i < durationWeeks; i++) {
            const wk = shiftWeek(startWeek, i);
            const wkArr = (goal.progress && goal.progress[wk]) || [];
            totalDoneInCycle += Math.min(target, wkArr.filter(function (v) { return v === 1; }).length);
          }
          const totalTargetInCycle = durationWeeks * target;
          cyclePct = Math.min(100, Math.round((totalDoneInCycle / totalTargetInCycle) * 100));
          cycleText = "Semana " + currentStep + " de " + durationWeeks + " · Ciclo: " + cyclePct + "%";
        }

        return {
          arr: arr,
          doneCount: doneCount,
          target: target,
          pct: pct,
          isCompleted: doneCount >= target,
          cycleText: cycleText,
          durationWeeks: durationWeeks
        };
      }

      function getVisibleEvents(weekKey) {
        return state.events.filter(function (ev) {
          if (ev.recurring) return ev.createdWeek <= weekKey;
          return ev.createdWeek === weekKey;
        });
      }

      function calculateMetricsForWeek(wk) {
        const activeGoals = getVisibleGoals(wk);
        let metasPct = 0;
        if (activeGoals.length > 0) {
          const sum = activeGoals.reduce(function (acc, g) {
            return acc + getGoalStats(g, wk).pct;
          }, 0);
          metasPct = Math.round(sum / activeGoals.length);
        }

        const totalTasks = state.tasks.length;
        const doneTasks = state.tasks.filter(function (t) { return t.done; }).length;
        const tarefasPct = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;

        const weekEvents = getVisibleEvents(wk);
        const totalEvents = weekEvents.length;
        const doneEvents = weekEvents.filter(function (e) {
          return e.completedWeeks && e.completedWeeks[wk];
        }).length;
        const agendaPct = totalEvents > 0 ? Math.round((doneEvents / totalEvents) * 100) : 0;

        const active = [];
        if (activeGoals.length > 0) active.push(metasPct);
        if (totalTasks > 0) active.push(tarefasPct);
        if (totalEvents > 0) active.push(agendaPct);

        const geralPct =
          active.length > 0
            ? Math.round(active.reduce(function (a, b) { return a + b; }, 0) / active.length)
            : 0;

        return {
          geralPct: geralPct,
          metasPct: metasPct,
          tarefasPct: tarefasPct,
          agendaPct: agendaPct
        };
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderHorizonOptions(selectedValue) {
        const choices = [
          { val: 1, label: "Apenas esta semana (1 semana)" },
          { val: 2, label: "2 semanas" },
          { val: 4, label: "4 semanas (1 mês)" },
          { val: 8, label: "8 semanas (2 meses)" },
          { val: 12, label: "12 semanas (Trimestre)" },
          { val: 24, label: "24 semanas (Semestre)" },
          { val: 0, label: "Contínua (repete toda semana)" }
        ];
        return choices
          .map(function (c) {
            const sel = Number(selectedValue) === c.val ? " selected" : "";
            return '<option value="' + c.val + '"' + sel + ">" + c.label + "</option>";
          })
          .join("");
      }

      function renderGoalCard(goal) {
        const wk = state.selectedWeek;
        const realCur = getRealCurrentWeekKey();
        const todayDayIdx = getRealTodayDayIndex();
        const weekDates = getWeekDayDates(wk);
        const st = getGoalStats(goal, wk);
        const isEditing = editingGoalId === goal.id;

        const options = [1, 2, 3, 4, 5, 6, 7]
          .map(function (n) {
            return (
              '<option value="' + n + '"' + (st.target === n ? " selected" : "") + ">Meta: " + n + "x/sem</option>"
            );
          })
          .join("");

        const editFreqOptions = [1, 2, 3, 4, 5, 6, 7]
          .map(function (n) {
            return (
              '<option value="' + n + '"' + (st.target === n ? " selected" : "") + ">" + n + (n === 1 ? " dia/sem" : " dias/sem") + "</option>"
            );
          })
          .join("");

        const delKey = "del-goal:" + goal.id;
        const isConfirming = pendingConfirm === delKey;

        const editFormHtml = isEditing
          ? '<div class="edit-goal-box">' +
              '<form data-form="edit-goal" data-id="' + goal.id + '">' +
                '<div class="edit-goal-grid">' +
                  "<div>" +
                    '<label class="edit-goal-label">Nome da meta</label>' +
                    '<input type="text" name="title" style="width:100%;" value="' + escapeHtml(goal.title) + '" required />' +
                  "</div>" +
                  "<div>" +
                    '<label class="edit-goal-label">Frequência</label>' +
                    '<select name="target" style="width:100%;">' + editFreqOptions + "</select>" +
                  "</div>" +
                  "<div>" +
                    '<label class="edit-goal-label">Duração / Repetição</label>' +
                    '<select name="durationWeeks" style="width:100%;">' + renderHorizonOptions(st.durationWeeks) + "</select>" +
                  "</div>" +
                "</div>" +
                '<div class="edit-goal-footer">' +
                  '<button type="button" class="btn-cancel" data-action="cancel-edit-goal">Cancelar</button>' +
                  '<button type="submit" class="btn-primary btn-blue">Salvar alterações</button>' +
                "</div>" +
              "</form>" +
            "</div>"
          : "";

        const daysHtml = DAYS.map(function (label, idx) {
          const val = st.arr[idx] || 0;
          const cls = val === 1 ? "done" : val === 2 ? "fail" : "";
          const isToday = wk === realCur && idx === todayDayIdx;
          const icon = val === 1 ? "✓" : val === 2 ? "✕" : "•";
          const dayNum = String(weekDates[idx].dayNumber).padStart(2, "0");
          return (
            '<button type="button" class="day-btn ' + cls + (isToday ? " today-day" : "") + '" data-action="cycle-day" data-id="' + goal.id + '" data-day="' + idx + '">' +
              '<span class="d-label">' + label + "</span>" +
              '<span class="d-date">' + dayNum + "</span>" +
              '<span class="d-icon">' + icon + "</span>" +
            "</button>"
          );
        }).join("");

        return (
          '<div class="meta-card">' +
            '<div class="meta-top">' +
              '<div class="meta-title-group">' +
                '<span class="meta-name">' + escapeHtml(goal.title) + "</span>" +
                '<select class="freq-select" data-action="change-freq" data-id="' + goal.id + '">' + options + "</select>" +
                '<span class="meta-badge ' + (st.isCompleted ? "completed" : "") + '">' +
                  st.doneCount + "/" + st.target + " dias · " + st.pct + "% " + (st.isCompleted ? "✓" : "") +
                "</span>" +
              "</div>" +
              '<div class="meta-actions-right">' +
                '<button type="button" class="btn-edit" data-action="toggle-edit-goal" data-id="' + goal.id + '">' +
                  (isEditing ? "Fechar" : "✎ Editar") +
                "</button>" +
                '<button type="button" class="btn-del ' + (isConfirming ? "confirming" : "") + '" data-action="del-goal" data-id="' + goal.id + '">' +
                  (isConfirming ? "Excluir?" : "✕") +
                "</button>" +
              "</div>" +
            "</div>" +
            editFormHtml +
            '<div class="cycle-info">' + st.cycleText + "</div>" +
            '<div class="progress-bar-bg">' +
              '<div class="progress-bar-fill ' + (st.isCompleted ? "completed" : "") + '" style="width: ' + st.pct + '%"></div>' +
            "</div>" +
            '<div class="days-row">' + daysHtml + "</div>" +
          "</div>"
        );
      }

      function renderMetasSection(isOverview) {
        const formKey = isOverview ? "overview-goal" : "goal";
        const addBtnHtml =
          '<button type="button" class="btn-primary btn-blue" data-action="toggle-form" data-form-name="' + formKey + '">+ Nova Meta</button>';

        const formHtml =
          openForm === formKey
            ? '<div class="form-box">' +
                '<form class="form-row" data-form="add-goal">' +
                  '<input type="text" name="title" class="grow" placeholder="Nome da meta (ex: CrossFit, Estudo...)" required />' +
                  '<select name="target">' +
                    '<option value="1">1 dia/sem</option>' +
                    '<option value="2">2 dias/sem</option>' +
                    '<option value="3" selected>3 dias/sem</option>' +
                    '<option value="4">4 dias/sem</option>' +
                    '<option value="5">5 dias/sem</option>' +
                    '<option value="6">6 dias/sem</option>' +
                    '<option value="7">7 dias/sem</option>' +
                  "</select>" +
                  '<select name="durationWeeks">' +
                    renderHorizonOptions(4) +
                  "</select>" +
                  '<button type="submit" class="btn-primary btn-blue">Salvar</button>' +
                  '<button type="button" class="btn-cancel" data-action="close-form">Cancelar</button>' +
                "</form>" +
              "</div>"
            : "";

        const visibleGoals = getVisibleGoals(state.selectedWeek);
        const listHtml =
          visibleGoals.length > 0
            ? visibleGoals.map(renderGoalCard).join("")
            : '<div class="empty-msg">Nenhuma meta ativa nesta semana.</div>';

        return (
          '<section class="panel metas-theme">' +
            '<div class="panel-header">' +
              '<div class="panel-title">Fase 1 · Metas Semanais</div>' +
              '<div class="header-btns">' + addBtnHtml + "</div>" +
            "</div>" +
            formHtml +
            listHtml +
          "</section>"
        );
      }

      function renderTarefasSection(isOverview) {
        const cats = ["Todas"].concat(state.categories);
        const pillsHtml = cats
          .map(function (c) {
            return (
              '<button type="button" class="cat-pill ' + (state.selectedCategory === c ? "active" : "") + '" ' +
              'data-action="select-cat" data-cat="' + escapeHtml(c) + '">' + escapeHtml(c) + "</button>"
            );
          })
          .join("");

        const catOptions = state.categories
          .map(function (c) {
            const sel = state.selectedCategory === c ? " selected" : "";
            return '<option value="' + escapeHtml(c) + '"' + sel + ">" + escapeHtml(c) + "</option>";
          })
          .join("");

        const canDeleteList = state.selectedCategory !== "Todas";
        var delListKey = "del-cat:" + state.selectedCategory;
        var isConfirmingList = pendingConfirm === delListKey;

        const delListBtn = canDeleteList
          ? '<button type="button" class="btn-del ' + (isConfirmingList ? "confirming" : "") + '" data-action="del-cat" data-cat="' + escapeHtml(state.selectedCategory) + '">' +
              (isConfirmingList ? "Excluir lista?" : 'Excluir "' + escapeHtml(state.selectedCategory) + '"') +
            "</button>"
          : "";

        const catFormKey = isOverview ? "overview-cat" : "cat";
        const taskFormKey = isOverview ? "overview-task" : "task";

        const actionBtns =
          '<button type="button" class="btn-outline-green" data-action="toggle-form" data-form-name="' + catFormKey + '">+ Nova Lista</button>' +
          '<button type="button" class="btn-primary btn-green" data-action="toggle-form" data-form-name="' + taskFormKey + '">+ Nova Tarefa</button>';

        let formHtml = "";
        if (openForm === taskFormKey) {
          formHtml =
            '<div class="form-box">' +
              '<form class="form-row" data-form="add-task">' +
                '<input type="text" name="text" class="grow" placeholder="Descreva a tarefa..." required />' +
                '<select name="category">' + catOptions + "</select>" +
                '<button type="submit" class="btn-primary btn-green">Salvar</button>' +
                '<button type="button" class="btn-cancel" data-action="close-form">Cancelar</button>' +
              "</form>" +
            "</div>";
        } else if (openForm === catFormKey) {
          formHtml =
            '<div class="form-box">' +
              '<form class="form-row" data-form="add-cat">' +
                '<input type="text" name="catName" class="grow" placeholder="Nome da nova lista (ex: Saúde, Viagem...)" required />' +
                '<button type="submit" class="btn-primary btn-green">Criar Lista</button>' +
                '<button type="button" class="btn-cancel" data-action="close-form">Cancelar</button>' +
              "</form>" +
            "</div>";
        }

        const filteredTasks =
          state.selectedCategory === "Todas"
            ? state.tasks
            : state.tasks.filter(function (t) { return t.category === state.selectedCategory; });

        const tasksHtml =
          filteredTasks.length > 0
            ? filteredTasks
                .map(function (t) {
                  const delKey = "del-task:" + t.id;
                  const isConf = pendingConfirm === delKey;
                  return (
                    '<div class="item-row ' + (t.done ? "checked" : "") + '">' +
                      '<div class="item-left" data-action="toggle-task" data-id="' + t.id + '">' +
                        '<div class="check-circle">✓</div>' +
                        '<span class="item-text">' + escapeHtml(t.text) + "</span>" +
                      "</div>" +
                      '<span class="tag-chip">' + escapeHtml(t.category) + "</span>" +
                      '<button type="button" class="btn-del ' + (isConf ? "confirming" : "") + '" data-action="del-task" data-id="' + t.id + '">' +
                        (isConf ? "Excluir?" : "✕") +
                      "</button>" +
                    "</div>"
                  );
                })
                .join("")
            : '<div class="empty-msg">Nenhuma tarefa nesta lista.</div>';

        return (
          '<section class="panel tarefas-theme">' +
            '<div class="panel-header">' +
              '<div class="panel-title">Fase 2 · Listas de Tarefas</div>' +
              '<div class="header-btns">' + actionBtns + "</div>" +
            "</div>" +
            formHtml +
            '<div class="category-bar">' +
              '<div class="category-pills">' + pillsHtml + "</div>" +
              delListBtn +
            "</div>" +
            tasksHtml +
          "</section>"
        );
      }

      function renderAgendaSection(isOverview) {
        const wk = state.selectedWeek;
        const realCur = getRealCurrentWeekKey();
        const todayDayIdx = getRealTodayDayIndex();

        const weekEvents = getVisibleEvents(wk).sort(function (a, b) {
          if (a.dayIndex !== b.dayIndex) return a.dayIndex - b.dayIndex;
          return (a.time || "").localeCompare(b.time || "");
        });

        // Seletor limpo sem data entre parênteses, com opção "Todos os dias" e dia atual pré-selecionado
        const dayOptions =
          '<option value="all">Todos os dias (Seg a Dom)</option>' +
          DAYS.map(function (d, i) {
            const isRealTodayOption = i === todayDayIdx;
            const label = d + (isRealTodayOption ? " · Hoje" : "");
            return '<option value="' + i + '"' + (isRealTodayOption ? " selected" : "") + ">" + label + "</option>";
          }).join("");

        const evFormKey = isOverview ? "overview-event" : "event";
        const addBtnHtml =
          '<button type="button" class="btn-primary btn-amber" data-action="toggle-form" data-form-name="' + evFormKey + '">+ Novo Compromisso</button>';

        const formHtml =
          openForm === evFormKey
            ? '<div class="form-box">' +
                '<form class="form-row" data-form="add-event">' +
                  '<input type="text" name="title" class="grow" placeholder="Compromisso ou rotina..." required />' +
                  '<select name="dayIndex">' + dayOptions + "</select>" +
                  '<input type="time" name="time" value="09:00" />' +
                  '<label class="checkbox-inline">' +
                    '<input type="checkbox" name="recurring" checked />' +
                    "Repetir semanalmente" +
                  "</label>" +
                  '<button type="submit" class="btn-primary btn-amber">Salvar</button>' +
                  '<button type="button" class="btn-cancel" data-action="close-form">Cancelar</button>' +
                "</form>" +
              "</div>"
            : "";

        const eventsHtml =
          weekEvents.length > 0
            ? weekEvents
                .map(function (ev) {
                  const isDone = Boolean(ev.completedWeeks && ev.completedWeeks[wk]);
                  const isTodayEvent = wk === realCur && ev.dayIndex === todayDayIdx;
                  const delKey = "del-event:" + ev.id;
                  const isConf = pendingConfirm === delKey;
                  return (
                    '<div class="item-row ' + (isDone ? "checked" : "") + (isTodayEvent ? " today-event" : "") + '">' +
                      '<div class="item-left" data-action="toggle-event" data-id="' + ev.id + '">' +
                        '<div class="check-circle">✓</div>' +
                        '<span class="item-text">' +
                          "<strong>" + DAYS[ev.dayIndex] + (ev.time ? " · " + ev.time : "") + "</strong> — " + escapeHtml(ev.title) +
                        "</span>" +
                      "</div>" +
                      (isTodayEvent ? '<span class="tag-chip tag-today">Hoje</span>' : "") +
                      (ev.recurring ? '<span class="tag-chip tag-repeat">↻ Semanal</span>' : "") +
                      '<button type="button" class="btn-del ' + (isConf ? "confirming" : "") + '" data-action="del-event" data-id="' + ev.id + '">' +
                        (isConf ? "Excluir?" : "✕") +
                      "</button>" +
                    "</div>"
                  );
                })
                .join("")
            : '<div class="empty-msg">Nenhum compromisso agendado para esta semana.</div>';

        return (
          '<section class="panel agenda-theme">' +
            '<div class="panel-header">' +
              '<div class="panel-title">Fase 3 · Agenda Semanal</div>' +
              '<div class="header-btns">' + addBtnHtml + "</div>" +
            "</div>" +
            formHtml +
            eventsHtml +
          "</section>"
        );
      }

      /* ==================================================================
         MODAL DE DESEMPENHO: 1 CARD POR LINHA (GERAL, METAS, TAREFAS, AGENDA)
         ================================================================== */
      function renderPerformanceModal() {
        if (!showChartModal) return "";

        const realCur = getRealCurrentWeekKey();
        const weeks = [
          shiftWeek(realCur, -3),
          shiftWeek(realCur, -2),
          shiftWeek(realCur, -1),
          realCur
        ];

        const weekData = weeks.map(function (wk) {
          return {
            wk: wk,
            label: wk === realCur ? "Atual" : formatWeekShort(wk),
            metrics: calculateMetricsForWeek(wk)
          };
        });

        const selectedMetrics = calculateMetricsForWeek(state.selectedWeek);
        const opacities = ["0.38", "0.56", "0.78", "1"];

        const phases = [
          {
            key: "geral",
            title: "Geral",
            color: "#6366F1",
            currentPct: selectedMetrics.geralPct,
            field: "geralPct"
          },
          {
            key: "metas",
            title: "Metas",
            color: "#2563EB",
            currentPct: selectedMetrics.metasPct,
            field: "metasPct"
          },
          {
            key: "tarefas",
            title: "Tarefas",
            color: "#059669",
            currentPct: selectedMetrics.tarefasPct,
            field: "tarefasPct"
          },
          {
            key: "agenda",
            title: "Agenda",
            color: "#D97706",
            currentPct: selectedMetrics.agendaPct,
            field: "agendaPct"
          }
        ];

        const stackHtml = phases
          .map(function (ph) {
            const barsHtml = weekData
              .map(function (item, idx) {
                const val = item.metrics[ph.field];
                const barHeight = Math.max(10, Math.round((val / 100) * 72));
                const isSelected = item.wk === state.selectedWeek;
                return (
                  '<div class="week-bar-slot ' + (isSelected ? "selected" : "") + '" data-action="jump-week" data-week="' + item.wk + '">' +
                    '<span class="week-bar-pct">' + val + "%</span>" +
                    '<div class="week-bar-track">' +
                      '<div class="week-bar-pill" style="height: ' + barHeight + "px; background: " + ph.color + "; opacity: " + opacities[idx] + ';"></div>' +
                    "</div>" +
                    '<span class="week-bar-date">' + item.label + "</span>" +
                  "</div>"
                );
              })
              .join("");

            return (
              '<div class="phase-row-card ' + ph.key + '">' +
                '<div class="phase-row-header">' +
                  '<div class="phase-row-title" style="color: ' + ph.color + ';">' +
                    '<span class="phase-dot" style="background: ' + ph.color + ';"></span>' +
                    ph.title +
                  "</div>" +
                  '<div class="phase-row-current">' + ph.currentPct + "%</div>" +
                "</div>" +
                '<div class="weeks-bars-grid">' + barsHtml + "</div>" +
              "</div>"
            );
          })
          .join("");

        return (
          '<div class="modal-backdrop" data-action="backdrop-close">' +
            '<div class="modal-card">' +
              '<div class="modal-header">' +
                "<div>" +
                  '<div class="modal-title">EVOLUÇÃO (ÚLTIMAS 4 SEMANAS)</div>' +
                  '<div class="modal-sub">Semana selecionada: ' + formatWeekRangeLong(state.selectedWeek) + "</div>" +
                "</div>" +
                '<button type="button" class="modal-close" data-action="close-chart" title="Fechar">✕</button>' +
              "</div>" +
              '<div class="chart-helper">Toque em qualquer semana abaixo para abrir no painel</div>' +
              '<div class="phase-stack">' + stackHtml + "</div>" +
              '<button type="button" class="modal-footer-btn" data-action="close-chart">Fechar</button>' +
            "</div>" +
          "</div>"
        );
      }

      function render() {
        const root = document.getElementById("app");
        if (!root) return;

        const realCur = getRealCurrentWeekKey();
        const curMetrics = calculateMetricsForWeek(state.selectedWeek);

        const isStandalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;

        const pwaBannerHtml =
          !isStandalone && !state.dismissedPwaBanner
            ? '<div class="pwa-banner">' +
                "<div><strong>Usar como App:</strong> toque em <em>Compartilhar / Menu</em> e escolha <strong>Adicionar à tela inicial</strong>.</div>" +
                '<button type="button" class="pwa-close" data-action="dismiss-pwa" title="Fechar aviso">✕</button>' +
              "</div>"
            : "";

        let mainContent = "";
        if (state.activeTab === "overview") {
          mainContent =
            renderMetasSection(true) +
            renderTarefasSection(true) +
            renderAgendaSection(true);
        } else if (state.activeTab === "metas") {
          mainContent = renderMetasSection(false);
        } else if (state.activeTab === "tarefas") {
          mainContent = renderTarefasSection(false);
        } else if (state.activeTab === "agenda") {
          mainContent = renderAgendaSection(false);
        }

        const isResetConfirming = pendingConfirm === "reset-all";
        const isNotCurrentWeek = state.selectedWeek !== realCur;

        const navItems = [
          { tab: "overview", label: "Visão Geral", pct: curMetrics.geralPct, color: "#6366F1" },
          { tab: "metas", label: "Metas", pct: curMetrics.metasPct, color: "#2563EB" },
          { tab: "tarefas", label: "Tarefas", pct: curMetrics.tarefasPct, color: "#059669" },
          { tab: "agenda", label: "Agenda", pct: curMetrics.agendaPct, color: "#D97706" }
        ];

        const navHtml = navItems
          .map(function (item) {
            const isActive = state.activeTab === item.tab;
            return (
              '<button type="button" class="tab-btn ' + (isActive ? "active" : "") + '" data-action="nav" data-tab="' + item.tab + '">' +
                '<span class="tab-btn-title">' + item.label + "</span>" +
                renderNavRing(item.pct, item.color, isActive) +
              "</button>"
            );
          })
          .join("");

        root.innerHTML =
          pwaBannerHtml +
          "<header>" +
            '<div class="header-top-row">' +
              '<div class="brand" data-action="nav" data-tab="overview">' +
                '<div class="brand-logo">' + renderLogoSVG() + "</div>" +
                '<div class="brand-text">' +
                  "<h1>Três Fases</h1>" +
                  "<p>Metas · Tarefas · Agenda</p>" +
                "</div>" +
              "</div>" +
              '<div class="top-actions">' +
                '<button type="button" class="btn-chart" data-action="open-chart">Desempenho</button>' +
                '<button type="button" class="btn-reset ' + (isResetConfirming ? "confirming" : "") + '" data-action="reset-all">' +
                  (isResetConfirming ? "Zerar tudo?" : "Resetar") +
                "</button>" +
              "</div>" +
            "</div>" +
            '<div class="week-nav">' +
              '<button type="button" class="arrow-btn" data-action="prev-week" title="Semana anterior">◀</button>' +
              '<div class="week-center">' +
                '<span class="week-tag">' + getWeekRelativeTitle(state.selectedWeek) + "</span>" +
                '<span class="week-label">' + formatWeekRangeLong(state.selectedWeek) + "</span>" +
              "</div>" +
              (isNotCurrentWeek ? '<button type="button" class="btn-today-pill" data-action="go-today" title="Voltar para a semana atual">Hoje</button>' : "") +
              '<button type="button" class="arrow-btn" data-action="next-week" title="Próxima semana">▶</button>' +
            "</div>" +
          "</header>" +
          '<nav class="nav-tabs">' + navHtml + "</nav>" +
          "<main>" + mainContent + "</main>" +
          renderPerformanceModal();
      }

      document.addEventListener("click", function (e) {
        const target = e.target.closest("[data-action]");
        if (!target) return;

        const action = target.getAttribute("data-action");

        if (action === "backdrop-close") {
          if (e.target === target) {
            showChartModal = false;
            render();
          }
          return;
        }

        if (action === "open-chart") {
          showChartModal = true;
          render();
          return;
        }

        if (action === "close-chart") {
          showChartModal = false;
          render();
          return;
        }

        if (action === "jump-week") {
          const wk = target.getAttribute("data-week");
          showChartModal = false;
          editingGoalId = null;
          saveState({ ...state, selectedWeek: wk });
          render();
          return;
        }

        if (action === "go-today") {
          editingGoalId = null;
          saveState({ ...state, selectedWeek: getRealCurrentWeekKey() });
          render();
          return;
        }

        if (action === "dismiss-pwa") {
          saveState({ ...state, dismissedPwaBanner: true });
          render();
          return;
        }

        if (action === "nav") {
          pendingConfirm = null;
          openForm = null;
          editingGoalId = null;
          saveState({ ...state, activeTab: target.getAttribute("data-tab") });
          render();
          return;
        }

        if (action === "toggle-form") {
          const fname = target.getAttribute("data-form-name");
          openForm = openForm === fname ? null : fname;
          render();
          return;
        }

        if (action === "close-form") {
          openForm = null;
          render();
          return;
        }

        if (action === "toggle-edit-goal") {
          const id = target.getAttribute("data-id");
          pendingConfirm = null;
          editingGoalId = editingGoalId === id ? null : id;
          render();
          return;
        }

        if (action === "cancel-edit-goal") {
          editingGoalId = null;
          render();
          return;
        }

        if (action === "prev-week") {
          editingGoalId = null;
          saveState({ ...state, selectedWeek: shiftWeek(state.selectedWeek, -1) });
          render();
          return;
        }

        if (action === "next-week") {
          editingGoalId = null;
          saveState({ ...state, selectedWeek: shiftWeek(state.selectedWeek, 1) });
          render();
          return;
        }

        if (action === "reset-all") {
          if (!requestConfirm("reset-all")) return;
          openForm = null;
          editingGoalId = null;
          saveState({
            activeTab: state.activeTab,
            selectedWeek: getRealCurrentWeekKey(),
            selectedCategory: "Todas",
            dismissedPwaBanner: state.dismissedPwaBanner,
            categories: ["Trabalho", "Torneio", "Casa", "Mercado"],
            goals: [],
            tasks: [],
            events: []
          });
          render();
          return;
        }

        if (action === "cycle-day") {
          const id = target.getAttribute("data-id");
          const dayIdx = Number(target.getAttribute("data-day"));
          const wk = state.selectedWeek;

          const goals = state.goals.map(function (g) {
            if (g.id !== id) return g;
            const currentArr = (g.progress && g.progress[wk]) || [0, 0, 0, 0, 0, 0, 0];
            const nextArr = currentArr.slice();
            nextArr[dayIdx] = ((nextArr[dayIdx] || 0) + 1) % 3;
            return {
              ...g,
              progress: { ...(g.progress || {}), [wk]: nextArr }
            };
          });

          saveState({ ...state, goals: goals });
          render();
          return;
        }

        if (action === "del-goal") {
          const id = target.getAttribute("data-id");
          if (!requestConfirm("del-goal:" + id)) return;
          if (editingGoalId === id) editingGoalId = null;
          saveState({
            ...state,
            goals: state.goals.filter(function (g) { return g.id !== id; })
          });
          render();
          return;
        }

        if (action === "select-cat") {
          pendingConfirm = null;
          saveState({ ...state, selectedCategory: target.getAttribute("data-cat") });
          render();
          return;
        }

        if (action === "del-cat") {
          const cat = target.getAttribute("data-cat");
          if (!requestConfirm("del-cat:" + cat)) return;
          const nextCats = state.categories.filter(function (c) { return c !== cat; });
          const nextTasks = state.tasks.filter(function (t) { return t.category !== cat; });
          saveState({
            ...state,
            categories: nextCats,
            tasks: nextTasks,
            selectedCategory: "Todas"
          });
          render();
          return;
        }

        if (action === "toggle-task") {
          const id = target.getAttribute("data-id");
          const tasks = state.tasks.map(function (t) {
            return t.id === id ? { ...t, done: !t.done } : t;
          });
          saveState({ ...state, tasks: tasks });
          render();
          return;
        }

        if (action === "del-task") {
          const id = target.getAttribute("data-id");
          if (!requestConfirm("del-task:" + id)) return;
          saveState({
            ...state,
            tasks: state.tasks.filter(function (t) { return t.id !== id; })
          });
          render();
          return;
        }

        if (action === "toggle-event") {
          const id = target.getAttribute("data-id");
          const wk = state.selectedWeek;
          const events = state.events.map(function (ev) {
            if (ev.id !== id) return ev;
            const comp = { ...(ev.completedWeeks || {}) };
            comp[wk] = !comp[wk];
            return { ...ev, completedWeeks: comp };
          });
          saveState({ ...state, events: events });
          render();
          return;
        }

        if (action === "del-event") {
          const id = target.getAttribute("data-id");
          if (!requestConfirm("del-event:" + id)) return;
          saveState({
            ...state,
            events: state.events.filter(function (ev) { return ev.id !== id; })
          });
          render();
          return;
        }
      });

      document.addEventListener("change", function (e) {
        const target = e.target.closest('[data-action="change-freq"]');
        if (!target) return;
        const id = target.getAttribute("data-id");
        const val = Number(target.value) || 1;
        const goals = state.goals.map(function (g) {
          return g.id === id ? { ...g, targetPerWeek: val } : g;
        });
        saveState({ ...state, goals: goals });
        render();
      });

      document.addEventListener("submit", function (e) {
        const form = e.target.closest("[data-form]");
        if (!form) return;
        e.preventDefault();

        const type = form.getAttribute("data-form");
        const fd = new FormData(form);

        if (type === "add-goal") {
          const title = String(fd.get("title") || "").trim();
          const targetPerWeek = Number(fd.get("target")) || 3;
          const durationWeeks = Number(fd.get("durationWeeks"));
          if (!title) return;
          const normalizedDur = isNaN(durationWeeks) ? 4 : durationWeeks;
          const newGoal = {
            id: "g_" + Date.now(),
            title: title,
            targetPerWeek: targetPerWeek,
            durationWeeks: normalizedDur,
            repeatWeekly: normalizedDur !== 1,
            startWeek: state.selectedWeek,
            progress: {}
          };
          openForm = null;
          saveState({ ...state, goals: state.goals.concat([newGoal]) });
          render();
          return;
        }

        if (type === "edit-goal") {
          const id = form.getAttribute("data-id");
          const title = String(fd.get("title") || "").trim();
          const targetPerWeek = Number(fd.get("target")) || 3;
          const durationWeeks = Number(fd.get("durationWeeks"));
          if (!title) return;
          const normalizedDur = isNaN(durationWeeks) ? 4 : durationWeeks;

          const goals = state.goals.map(function (g) {
            if (g.id !== id) return g;
            return {
              ...g,
              title: title,
              targetPerWeek: targetPerWeek,
              durationWeeks: normalizedDur,
              repeatWeekly: normalizedDur !== 1,
              startWeek: normalizedDur === 1 ? state.selectedWeek : (g.startWeek || state.selectedWeek)
            };
          });

          editingGoalId = null;
          saveState({ ...state, goals: goals });
          render();
          return;
        }

        if (type === "add-task") {
          const text = String(fd.get("text") || "").trim();
          const category = String(fd.get("category") || state.categories[0] || "Geral");
          if (!text) return;
          const newTask = {
            id: "t_" + Date.now(),
            text: text,
            category: category,
            done: false
          };
          openForm = null;
          saveState({ ...state, tasks: state.tasks.concat([newTask]) });
          render();
          return;
        }

        if (type === "add-cat") {
          const catName = String(fd.get("catName") || "").trim();
          if (!catName) return;
          const exists = state.categories.some(function (c) {
            return c.toLowerCase() === catName.toLowerCase();
          });
          const nextCats = exists ? state.categories : state.categories.concat([catName]);
          openForm = null;
          saveState({ ...state, categories: nextCats, selectedCategory: catName });
          render();
          return;
        }

        if (type === "add-event") {
          const title = String(fd.get("title") || "").trim();
          const dayRaw = String(fd.get("dayIndex") || "");
          const time = String(fd.get("time") || "");
          const recurring = fd.get("recurring") === "on";
          if (!title) return;

          const baseTs = Date.now();
          let createdEvents = [];

          if (dayRaw === "all") {
            createdEvents = [0, 1, 2, 3, 4, 5, 6].map(function (dIdx) {
              return {
                id: "e_" + baseTs + "_" + dIdx,
                title: title,
                dayIndex: dIdx,
                time: time,
                recurring: recurring,
                createdWeek: state.selectedWeek,
                completedWeeks: {}
              };
            });
          } else {
            const parsedDay = Number(dayRaw);
            createdEvents = [
              {
                id: "e_" + baseTs,
                title: title,
                dayIndex: isNaN(parsedDay) ? getRealTodayDayIndex() : parsedDay,
                time: time,
                recurring: recurring,
                createdWeek: state.selectedWeek,
                completedWeeks: {}
              }
            ];
          }

          openForm = null;
          saveState({ ...state, events: state.events.concat(createdEvents) });
          render();
          return;
        }
      });

      setupAppIconsAndManifest();
      render();
    })();
  </script>
</body>
</html>
